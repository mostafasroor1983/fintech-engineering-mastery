<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Engineering Mastery</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f97316'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='monospace' font-size='14' font-weight='700' fill='white'%3EEM%3C/text%3E%3C/svg%3E">
  <style>
    /* Minimal styles for the redirect splash — main CSS loads at index.html */
    html, body {
      height: 100%;
      margin: 0;
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .mark { width: 48px; height: 48px; background: #f97316; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-family: monospace; font-size: 16px; font-weight: 700; color: #fff; }
    h1 { font-size: 1rem; color: #8b949e; font-weight: 400; margin: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark">EM</div>
    <h1>Redirecting&hellip;</h1>
  </div>
  <script>
    // GitHub Pages 404 → preserve SPA hash routing
    // Handles both user pages (origin/) and project pages (origin/repo-name/)
    (function () {
      var l = window.location;
      // The base path is everything up to and including the repo name in the path
      // e.g. /fintech-engineering-mastery/ or just / for user pages
      var pathParts = l.pathname.split('/');
      // Find where index.html would live — the base is origin + first path segment if it's a project repo
      // We detect this by checking if pathname has more than 1 non-empty segment
      var segments = pathParts.filter(function(p) { return p !== ''; });
      var base;
      if (segments.length > 1) {
        // Project repo: origin/repo-name/ is the base
        base = l.origin + '/' + segments[0] + '/';
      } else {
        base = l.origin + '/';
      }
      var route = pathParts.slice(segments.length > 1 ? 2 : 1).filter(Boolean).join('/');
      if (!route) {
        window.location.replace(base);
      } else {
        window.location.replace(base + '#/' + route + (l.search || '') + (l.hash || ''));
      }
    }());
  </script>
</body>
</html>
