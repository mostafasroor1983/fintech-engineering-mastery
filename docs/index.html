<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Engineering Mastery — Principal Software Engineer development program for Staff and Principal roles in banking and FinTech.">
  <meta name="theme-color" content="#161b22">

  <title>Engineering Mastery</title>

  <!-- Apply saved language/direction and theme before first paint -->
  <script>
    (function () {
      try {
        var l = localStorage.getItem('em_lang');
        if (l === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
        var th = localStorage.getItem('em_theme');
        if (th) document.documentElement.setAttribute('data-theme', th);
      } catch (e) {}
    }());
  </script>

  <!-- Favicon (inline SVG data URI) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f97316'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='monospace' font-size='14' font-weight='700' fill='white'%3EEM%3C/text%3E%3C/svg%3E">

  <!-- Fonts: Google Sans (English), IBM Plex Sans Arabic (Arabic) and JetBrains Mono (code); system fallbacks in main.css -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400..700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400..600&display=swap">

  <!-- Styles -->
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/lesson.css">
  <link rel="stylesheet" href="assets/css/lab.css">
  <link rel="stylesheet" href="assets/css/concurrency-lab.css">
  <link rel="stylesheet" href="assets/css/rtl.css">

  <!-- CDN Libraries (loaded before our scripts). Versions are pinned and checked with SRI hashes:
       when you change a version, recompute the hash, e.g.
       curl -s URL | openssl dgst -sha384 -binary | openssl base64 -A -->
  <!-- Prism.js — syntax highlighting (no bundled theme; lesson.css provides tokens).
       The autoloader fetches each language (java, sql, yaml, hcl, ...) the first time a page uses it. -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js" integrity="sha384-BGaNxfftg+9+TtC098wxawPFVEUpKYvaiCgbB0iqAMjK/4jDdmUY+oGxrPNvnXEf" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js" integrity="sha384-Uq05+JLko69eOiPr39ta9bh7kld5PKZoU+fF7g0EXTAriEollhZ+DrN8Q/Oi8J2Q" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
  <!-- marked.js — Markdown renderer -->
  <script src="https://cdn.jsdelivr.net/npm/marked@14.1.3/marked.min.js" integrity="sha384-k8o8HikHweyzW55Wd3wl18ovJj6vHVYNQeQbeSM0fxx+0WiH4TcccOG9uz8Xd2JR" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
  <!-- js-yaml — YAML frontmatter parser -->
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js" integrity="sha384-+pxiN6T7yvpryuJmE1gM9PX7yQit15auDb+ZwwvJOd/4be2Cie5/IuVXgQb/S9du" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
  <!-- lunr.js — full-text search index -->
  <script src="https://cdn.jsdelivr.net/npm/lunr@2.3.9/lunr.min.js" integrity="sha384-203J0SNzyqHby3iU6hzvzltrWi/M41wOP5Gu+BiJMz5nwKykbkUx8Kp7iti0Lpli" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
  <!-- Mermaid.js (2.5 MB) is not loaded here: renderer.js loads it the first time a page has a diagram. -->

  <!-- Open Graph -->
  <meta property="og:title"       content="Engineering Mastery">
  <meta property="og:description" content="Principal Software Engineer development program — Banking and FinTech.">
  <meta property="og:type"        content="website">
</head>
<body>

  <a class="skip-link" href="#main-content">Skip to main content</a>

  <div id="app-shell">

    <!-- Top Bar -->
    <header id="top-bar" role="banner">
      <!-- Rendered by app.js -->
    </header>

    <div id="app-body">

      <!-- Sidebar Navigation -->
      <nav id="sidebar" role="navigation" aria-label="Main navigation">
        <!-- Rendered by app.js -->
      </nav>

      <!-- Main Content (router injects pages here) -->
      <main id="main-content" role="main" aria-live="polite" tabindex="-1">
        <div class="loading-wrap">
          <div class="spinner"></div>
          <span style="color:var(--text-muted);font-size:var(--text-sm)">Loading&hellip; / جارٍ التحميل&hellip;</span>
        </div>
      </main>

    </div><!-- /#app-body -->

  </div><!-- /#app-shell -->

  <!-- Scripts (load order: i18n → progress → router → app → renderer → lab → concurrency-lab → search) -->
  <script src="assets/js/i18n.js" defer></script>
  <script src="assets/js/progress.js" defer></script>
  <script src="assets/js/router.js" defer></script>
  <script src="assets/js/app.js" defer></script>
  <script src="assets/js/renderer.js" defer></script>
  <script src="assets/js/lab.js" defer></script>
  <script src="assets/js/capstone.js" defer></script>
  <script src="assets/js/concurrency-lab.js" defer></script>
  <script src="assets/js/search.js" defer></script>

</body>
</html>
